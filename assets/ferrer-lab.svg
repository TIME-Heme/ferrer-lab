<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title">
  <title id="title">Ferrer Lab — blood cell monogram</title>
  <style>
    :root { --plasma: #ead3df; --nucleus: #55233e; --blood: #a42f50; --rim: #dc7080; --light: #fff9f8; }
  </style>
  <!-- A blast-like cell with a large nucleus. The F is drawn as a custom letterform. -->
  <g transform="translate(230 99)">
    <path fill="var(--plasma)" d="M-73-11C-69-50-42-72-5-73C35-76 66-54 74-19C84 19 64 52 30 69C-6 87-47 73-65 43C-74 29-76 9-73-11Z"/>
    <path fill="var(--nucleus)" d="M-60-13C-55-46-31-61-4-61C24-62 44-48 51-30C56-15 51-6 55 6C61 25 48 43 29 53C4 66-21 60-39 48C-58 35-65 10-60-13Z"/>
    <path fill="var(--light)" d="M-31-33H32L29-12H26Q25-25 14-26H-6V-3H6Q15-3 17-13H20L16 15H13Q14 4 5 4H-7L-10 25Q-10 30 0 31L-1 34H-37L-36 31Q-26 30-25 24L-18-24Q-17-29-31-30Z"/>
    <g fill="var(--nucleus)" opacity=".48"><circle cx="-45" cy="49" r="2.3"/><circle cx="-38" cy="58" r="1.8"/><circle cx="58" cy="-28" r="2"/><circle cx="63" cy="-19" r="1.8"/></g>
  </g>
  <!-- Erythrocytes in oblique view, with rims and central pallor. -->
  <g transform="translate(314 61) rotate(-30)">
    <ellipse rx="27" ry="17" fill="var(--blood)"/>
    <path d="M-23-4C-15-16 12-17 22-7C12-12-8-10-14-3C-19 2-20 5-22 5Q-27 2-23-4Z" fill="var(--rim)"/>
    <ellipse cx="3" cy="1" rx="12" ry="5" fill="var(--plasma)"/>
  </g>
  <g transform="translate(156 146) rotate(32)">
    <ellipse rx="19" ry="12" fill="var(--blood)"/>
    <ellipse cx="-1" cy="-1" rx="9" ry="4" fill="var(--rim)"/>
  </g>
  <text x="240" y="234" text-anchor="middle" fill="var(--nucleus)" font-family="Georgia, 'Times New Roman', serif" font-size="67" letter-spacing="-2">Ferrer Lab</text>
</svg>
