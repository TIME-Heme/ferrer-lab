<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
  <title id="title">Ferrer Lab</title>
  <desc id="desc">A single blood cell with a methylation mark on one of three molecular data tracks.</desc>
  <style>
    :root { --cell: #ead3df; --nucleus: #55233e; --mark: #ffc5ba; --track: #fff9f8; }
  </style>
  <!-- Cell membrane and nucleus -->
  <path fill="var(--cell)" d="M240 25c43-1 78 27 79 70 2 41-31 77-74 79-46 3-82-27-83-70-2-44 32-78 78-79Z"/>
  <path fill="var(--nucleus)" d="M239 39c33-2 62 21 63 55 2 35-23 62-57 65-37 3-65-21-67-55-2-36 25-63 61-65Z"/>
  <!-- Three molecular layers measured in one cell. The lollipop denotes methylation. -->
  <g fill="none" stroke="var(--track)" stroke-width="5" stroke-linecap="round">
    <path d="M210 87h58 M210 102h42 M210 117h51"/>
    <path d="M251 87V74" stroke="var(--mark)"/>
  </g>
  <circle cx="251" cy="71" r="5.5" fill="var(--mark)"/>
  <text x="240" y="238" text-anchor="middle" fill="var(--nucleus)" font-family="Georgia, 'Times New Roman', serif" font-size="67" letter-spacing="-2">Ferrer Lab</text>
</svg>
